<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowDesk — Professional Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --bg2: #131316;
  --bg3: #1a1a1f;
  --bg4: #222228;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f2;
  --text2: #8a8a96;
  --text3: #55555f;
  --accent: #6c63ff;
  --accent2: #8b83ff;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --pink: #ec4899;
  --teal: #14b8a6;
  --r: 10px;
  --r2: 14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}
/* Layout */
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
/* Topbar */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg);position:relative;z-index:10}
.logo{font-size:15px;font-weight:600;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.topbar-search{flex:1;max-width:360px;margin:0 auto;position:relative}
.topbar-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 12px 7px 34px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border .2s}
.topbar-search input:focus{border-color:var(--accent)}
.topbar-search input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4;font-size:14px}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer}
.notif-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;transition:border .2s}
.notif-btn:hover{border-color:var(--border2)}
.notif-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);border:1.5px solid var(--bg)}
/* Sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sidebar-section{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:12px 8px 6px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);border:none;background:none;width:100%;text-align:left;transition:all .15s;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(108,99,255,.15);color:var(--accent2)}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-label{flex:1}
.nav-badge{font-size:10px;background:var(--bg4);color:var(--text3);padding:2px 6px;border-radius:10px;font-family:'DM Mono',monospace}
.nav-item.active .nav-badge{background:rgba(108,99,255,.2);color:var(--accent2)}
.proj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
/* Command bar */
.cmd-bar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
.page-title{font-size:16px;font-weight:600;letter-spacing:-.02em}
.page-sub{font-size:12px;color:var(--text3);margin-top:2px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:500}
.btn:hover{border-color:var(--border2);color:var(--text)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.view-toggle{display:flex;background:var(--bg3);border-radius:8px;border:1px solid var(--border);overflow:hidden}
.view-btn{padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text3);background:transparent;border:none;transition:all .15s;font-family:inherit}
.view-btn.active{background:var(--bg4);color:var(--text)}
/* Stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.stat-box::after{content:'';position:absolute;top:0;right:0;width:3px;height:100%;border-radius:0 10px 10px 0}
.stat-box.s-total::after{background:var(--text3)}
.stat-box.s-done::after{background:var(--green)}
.stat-box.s-due::after{background:var(--amber)}
.stat-box.s-over::after{background:var(--red)}
.stat-num{font-size:22px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-.02em}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:3px}
/* Filters */
.filter-row{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);overflow-x:auto}
.chip{padding:4px 11px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:inherit;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--border2);color:var(--text2)}
.chip.active{background:rgba(108,99,255,.15);border-color:rgba(108,99,255,.4);color:var(--accent2)}
/* Task list */
.task-scroll{flex:1;overflow-y:auto;padding:10px 20px}
.task-scroll::-webkit-scrollbar{width:4px}
.task-scroll::-webkit-scrollbar-track{background:transparent}
.task-scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.group-header{display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.group-line{flex:1;height:1px;background:var(--border)}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:3px;position:relative}
.task-row:hover{background:var(--bg3);border-color:var(--border)}
.task-row.selected{background:rgba(108,99,255,.08);border-color:rgba(108,99,255,.25)}
.task-row.done-row .task-name{text-decoration:line-through;color:var(--text3)}
.check-btn{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.check-btn:hover{border-color:var(--accent)}
.check-btn.checked{background:var(--green);border-color:var(--green)}
.check-btn.checked::after{content:'';display:block;width:5px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.task-name{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-tags{display:flex;gap:5px;align-items:center}
.pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.pri-high{background:rgba(239,68,68,.15);color:#f87171}
.pri-med{background:rgba(245,158,11,.15);color:#fbbf24}
.pri-low{background:rgba(34,197,94,.15);color:#4ade80}
.proj-pill{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid}
.due-lbl{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);white-space:nowrap}
.due-lbl.overdue{color:#f87171}
.due-lbl.today{color:#fbbf24}
.assignee-ava{width:20px;height:20px;border-radius:50%;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drag-handle{color:var(--text3);opacity:0;cursor:grab;font-size:12px;transition:opacity .15s;padding:0 2px}
.task-row:hover .drag-handle{opacity:1}
/* Detail panel */
.detail{width:300px;border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;transition:width .25s;overflow:hidden}
.detail.closed{width:0;border:none}
.detail-inner{width:300px;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.detail-inner::-webkit-scrollbar{width:3px}
.detail-inner::-webkit-scrollbar-thumb{background:var(--bg4)}
.detail-header{display:flex;align-items:flex-start;gap:10px}
.detail-title{font-size:14px;font-weight:500;line-height:1.4;flex:1}
.detail-close{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .15s}
.detail-close:hover{border-color:var(--border2);color:var(--text)}
.detail-section{display:flex;flex-direction:column;gap:6px}
.dl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.dv{font-size:13px;color:var(--text2)}
.progress-track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.2,1)}
.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag-item{padding:3px 9px;background:var(--bg4);border-radius:20px;font-size:11px;color:var(--text2)}
.subtask-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.subtask-item:last-child{border:none}
.activity-item{display:flex;gap:8px;padding:5px 0}
.activity-ava{width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.activity-text{font-size:12px;color:var(--text2);line-height:1.5}
.activity-time{font-size:11px;color:var(--text3)}
/* Add form */
.add-bar{padding:10px 20px;border-top:1px solid var(--border);display:none;gap:8px;align-items:center;background:var(--bg2)}
.add-bar.open{display:flex}
.add-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border .2s}
.add-input:focus{border-color:var(--accent)}
.add-input::placeholder{color:var(--text3)}
.add-select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--text2);font-family:inherit;cursor:pointer;outline:none}
/* Kanban */
.kanban-view{display:none;flex:1;overflow-x:auto;padding:14px 20px;gap:14px}
.kanban-view.active{display:flex}
.kanban-col{min-width:240px;background:var(--bg3);border-radius:12px;border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px;max-height:100%}
.kanban-col-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.kanban-col-title{font-size:12px;font-weight:600;color:var(--text2)}
.kanban-col-count{font-size:10px;background:var(--bg4);color:var(--text3);padding:2px 6px;border-radius:8px;font-family:'DM Mono',monospace}
.kanban-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.kanban-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.kanban-card-title{font-size:12px;line-height:1.5;margin-bottom:6px}
.kanban-card-footer{display:flex;align-items:center;gap:6px}
/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--text3);gap:8px}
.empty-icon{font-size:32px;opacity:.4}
/* Animations */
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.task-row{animation:slideIn .2s ease both}
/* Tooltip */
.kbd{display:inline-block;background:var(--bg4);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;font-size:10px;font-family:'DM Mono',monospace;color:var(--text3)}
</style>
</head>
<body>
<div class="shell">

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo">
      <span class="logo-dot"></span>
      FlowDesk
    </div>
    <div class="topbar-search">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="Search tasks… (⌘K)" oninput="applyFilters()">
    </div>
    <div class="topbar-right">
      <button class="notif-btn" title="Notifications">
        🔔
        <span class="notif-dot"></span>
      </button>
      <div class="avatar" title="You">YO</div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">Overview</div>
    <button class="nav-item active" onclick="setProj('all',this)">
      <span class="nav-icon">◈</span>
      <span class="nav-label">All tasks</span>
      <span class="nav-badge" id="cnt-all">0</span>
    </button>
    <button class="nav-item" onclick="setProj('today',this)">
      <span class="nav-icon">◎</span>
      <span class="nav-label">Today</span>
      <span class="nav-badge" id="cnt-today">0</span>
    </button>
    <button class="nav-item" onclick="setProj('overdue',this)">
      <span class="nav-icon">⚠</span>
      <span class="nav-label">Overdue</span>
      <span class="nav-badge" id="cnt-over">0</span>
    </button>
    <button class="nav-item" onclick="setProj('done',this)">
      <span class="nav-icon">✓</span>
      <span class="nav-label">Completed</span>
      <span class="nav-badge" id="cnt-done">0</span>
    </button>

    <div class="sidebar-section">Projects</div>
    <button class="nav-item" onclick="setProj('Design',this)">
      <span class="proj-dot" style="background:#a78bfa"></span>
      <span class="nav-label">Design</span>
      <span class="nav-badge" id="cnt-Design">0</span>
    </button>
    <button class="nav-item" onclick="setProj('Engineering',this)">
      <span class="proj-dot" style="background:#34d399"></span>
      <span class="nav-label">Engineering</span>
      <span class="nav-badge" id="cnt-Engineering">0</span>
    </button>
    <button class="nav-item" onclick="setProj('Marketing',this)">
      <span class="proj-dot" style="background:#fb923c"></span>
      <span class="nav-label">Marketing</span>
      <span class="nav-badge" id="cnt-Marketing">0</span>
    </button>
    <button class="nav-item" onclick="setProj('Product',this)">
      <span class="proj-dot" style="background:#38bdf8"></span>
      <span class="nav-label">Product</span>
      <span class="nav-badge" id="cnt-Product">0</span>
    </button>

    <div class="sidebar-section">Tags</div>
    <button class="nav-item" onclick="setTagFilter('urgent')">
      <span class="nav-icon" style="color:#f87171">▲</span>
      <span class="nav-label">Urgent</span>
    </button>
    <button class="nav-item" onclick="setTagFilter('review')">
      <span class="nav-icon" style="color:#60a5fa">◉</span>
      <span class="nav-label">In review</span>
    </button>
    <button class="nav-item" onclick="setTagFilter('blocked')">
      <span class="nav-icon" style="color:#f59e0b">⊘</span>
      <span class="nav-label">Blocked</span>
    </button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Command bar -->
    <div class="cmd-bar">
      <div>
        <div class="page-title" id="view-title">All tasks</div>
        <div class="page-sub" id="view-sub">Loading…</div>
      </div>
      <div class="spacer"></div>
      <div class="view-toggle">
        <button class="view-btn active" onclick="setView('list',this)">≡ List</button>
        <button class="view-btn" onclick="setView('kanban',this)">⊞ Board</button>
      </div>
      <button class="btn" onclick="toggleAdd()">+ New task</button>
    </div>

    <!-- Stats -->
    <div class="stats-strip">
      <div class="stat-box s-total">
        <div class="stat-num" id="s-total">0</div>
        <div class="stat-lbl">Total tasks</div>
      </div>
      <div class="stat-box s-done">
        <div class="stat-num" id="s-done">0</div>
        <div class="stat-lbl">Completed</div>
      </div>
      <div class="stat-box s-due">
        <div class="stat-num" id="s-due">0</div>
        <div class="stat-lbl">Due today</div>
      </div>
      <div class="stat-box s-over">
        <div class="stat-num" id="s-over">0</div>
        <div class="stat-lbl">Overdue</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-row">
      <span style="font-size:11px;color:var(--text3);flex-shrink:0">Priority:</span>
      <button class="chip active" onclick="setPri(this,'all')">All</button>
      <button class="chip" onclick="setPri(this,'High')">🔴 High</button>
      <button class="chip" onclick="setPri(this,'Medium')">🟡 Medium</button>
      <button class="chip" onclick="setPri(this,'Low')">🟢 Low</button>
      <div style="width:1px;background:var(--border);height:18px;flex-shrink:0;margin:0 4px"></div>
      <span style="font-size:11px;color:var(--text3);flex-shrink:0">Assignee:</span>
      <button class="chip active" onclick="setAssignee(this,'all')">All</button>
      <button class="chip" onclick="setAssignee(this,'You')">You</button>
      <button class="chip" onclick="setAssignee(this,'Alex')">Alex</button>
      <button class="chip" onclick="setAssignee(this,'Sam')">Sam</button>
    </div>

    <!-- List view -->
    <div class="task-scroll" id="list-view">
      <div id="task-groups"></div>
    </div>

    <!-- Kanban view -->
    <div class="kanban-view" id="kanban-view">
      <div class="kanban-col" id="kb-todo">
        <div class="kanban-col-header">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--text3)"></div>
          <div class="kanban-col-title">TO DO</div>
          <div class="kanban-col-count" id="kb-todo-cnt">0</div>
        </div>
      </div>
      <div class="kanban-col" id="kb-progress">
        <div class="kanban-col-header">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--blue)"></div>
          <div class="kanban-col-title">IN PROGRESS</div>
          <div class="kanban-col-count" id="kb-progress-cnt">0</div>
        </div>
      </div>
      <div class="kanban-col" id="kb-review">
        <div class="kanban-col-header">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--amber)"></div>
          <div class="kanban-col-title">IN REVIEW</div>
          <div class="kanban-col-count" id="kb-review-cnt">0</div>
        </div>
      </div>
      <div class="kanban-col" id="kb-done">
        <div class="kanban-col-header">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--green)"></div>
          <div class="kanban-col-title">DONE</div>
          <div class="kanban-col-count" id="kb-done-cnt">0</div>
        </div>
      </div>
    </div>

    <!-- Add bar -->
    <div class="add-bar" id="add-bar">
      <input class="add-input" id="new-title" placeholder="Task title…" onkeydown="if(event.key==='Enter')addTask();if(event.key==='Escape')toggleAdd()">
      <select class="add-select" id="new-proj">
        <option value="Design">Design</option>
        <option value="Engineering">Engineering</option>
        <option value="Marketing">Marketing</option>
        <option value="Product">Product</option>
      </select>
      <select class="add-select" id="new-pri">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>
      <select class="add-select" id="new-status">
        <option value="todo">To Do</option>
        <option value="progress">In Progress</option>
        <option value="review">In Review</option>
      </select>
      <button class="btn btn-accent" onclick="addTask()">Add</button>
      <button class="btn" onclick="toggleAdd()">✕</button>
    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail closed" id="detail-panel">
    <div class="detail-inner" id="detail-inner"></div>
  </div>
</div>

<script>
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const daysFromNow = n => { const d=new Date(TODAY); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const MEMBERS = [
  {name:'You',color:'#6c63ff',bg:'rgba(108,99,255,.2)'},
  {name:'Alex',color:'#22c55e',bg:'rgba(34,197,94,.2)'},
  {name:'Sam',color:'#ec4899',bg:'rgba(236,72,153,.2)'},
];
const PROJ_COLORS = {Design:'#a78bfa',Engineering:'#34d399',Marketing:'#fb923c',Product:'#38bdf8'};

let tasks = [
  {id:1,title:'Redesign onboarding flow & user journey',project:'Design',priority:'High',status:'progress',tags:['urgent'],assignee:'You',due:daysFromNow(-2),done:false,subtasks:[{t:'Wireframes',d:true},{t:'Prototype',d:false}],notes:'Needs UX review before dev handoff.'},
  {id:2,title:'Update brand color palette for Q4',project:'Design',priority:'Medium',status:'review',tags:['review'],assignee:'Alex',due:daysFromNow(1),done:false,subtasks:[{t:'Color audit',d:true},{t:'Apply to components',d:true}],notes:''},
  {id:3,title:'Create icon set for v2 dashboard',project:'Design',priority:'Low',status:'todo',tags:[],assignee:'Sam',due:daysFromNow(6),done:false,subtasks:[],notes:''},
  {id:4,title:'Fix auth token refresh race condition',project:'Engineering',priority:'High',status:'progress',tags:['urgent','blocked'],assignee:'You',due:daysFromNow(0),done:false,subtasks:[{t:'Reproduce bug',d:true},{t:'Write fix',d:false},{t:'Test',d:false}],notes:'Blocking mobile release.'},
  {id:5,title:'Migrate frontend to React 19',project:'Engineering',priority:'Medium',status:'todo',tags:[],assignee:'Alex',due:daysFromNow(8),done:false,subtasks:[],notes:''},
  {id:6,title:'Write unit tests for payment API',project:'Engineering',priority:'Low',status:'done',tags:[],assignee:'You',due:daysFromNow(-5),done:true,subtasks:[{t:'Unit tests',d:true}],notes:''},
  {id:7,title:'Q3 campaign launch — email + social',project:'Marketing',priority:'High',status:'progress',tags:['urgent'],assignee:'Sam',due:daysFromNow(0),done:false,subtasks:[{t:'Email copy',d:true},{t:'Social assets',d:false}],notes:'Launch Thursday 9am.'},
  {id:8,title:'Write 6-part blog series on AI productivity',project:'Marketing',priority:'Medium',status:'todo',tags:[],assignee:'Alex',due:daysFromNow(5),done:false,subtasks:[],notes:''},
  {id:9,title:'Set up social media automation pipeline',project:'Marketing',priority:'Low',status:'done',tags:[],assignee:'Sam',due:daysFromNow(-3),done:true,subtasks:[],notes:''},
  {id:10,title:'Define v3 product roadmap',project:'Product',priority:'High',status:'review',tags:['review'],assignee:'You',due:daysFromNow(2),done:false,subtasks:[{t:'Stakeholder interviews',d:true},{t:'Prioritization',d:false}],notes:'Present to board next week.'},
  {id:11,title:'User research — onboarding drop-off',project:'Product',priority:'Medium',status:'progress',tags:[],assignee:'Alex',due:daysFromNow(4),done:false,subtasks:[],notes:''},
  {id:12,title:'Write PRD for notifications v2',project:'Product',priority:'Low',status:'todo',tags:[],assignee:'Sam',due:daysFromNow(10),done:false,subtasks:[],notes:''},
];
let nextId = 13;
let projFilter = 'all';
let priFilter = 'all';
let assigneeFilter = 'all';
let tagFilter = null;
let searchQ = '';
let selectedId = null;
let currentView = 'list';

function getMember(name){ return MEMBERS.find(m=>m.name===name)||MEMBERS[0]; }

function dueFmt(s){
  const d = new Date(s+'T00:00:00');
  const diff = Math.round((d - TODAY)/86400000);
  if(diff < -1) return {text: Math.abs(diff)+'d overdue', cls:'overdue'};
  if(diff === -1) return {text:'Yesterday', cls:'overdue'};
  if(diff === 0) return {text:'Today', cls:'today'};
  if(diff === 1) return {text:'Tomorrow', cls:''};
  return {text: d.toLocaleDateString('en',{month:'short',day:'numeric'}), cls:''};
}

function getVisible(){
  return tasks.filter(t => {
    if(projFilter==='done') return t.done;
    if(projFilter==='today') return t.due===daysFromNow(0)&&!t.done;
    if(projFilter==='overdue'){
      const diff=Math.round((new Date(t.due+'T00:00:00')-TODAY)/86400000);
      return diff<0&&!t.done;
    }
    if(projFilter!=='all'&&t.project!==projFilter) return false;
    if(priFilter!=='all'&&t.priority!==priFilter) return false;
    if(assigneeFilter!=='all'&&t.assignee!==assigneeFilter) return false;
    if(tagFilter&&!t.tags.includes(tagFilter)) return false;
    if(searchQ&&!t.title.toLowerCase().includes(searchQ.toLowerCase())) return false;
    return true;
  });
}

function renderList(){
  const visible = getVisible();
  const el = document.getElementById('task-groups');
  if(!visible.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">◈</div><div style="font-size:13px">No tasks found</div></div>`;
    return;
  }
  // Group by status
  const groups = [
    {key:'overdue-group', label:'Overdue', items: visible.filter(t=>!t.done&&Math.round((new Date(t.due+'T00:00:00')-TODAY)/86400000)<0)},
    {key:'progress', label:'In Progress', items: visible.filter(t=>t.status==='progress'&&!t.done&&Math.round((new Date(t.due+'T00:00:00')-TODAY)/86400000)>=0)},
    {key:'todo', label:'To Do', items: visible.filter(t=>t.status==='todo'&&!t.done)},
    {key:'review', label:'In Review', items: visible.filter(t=>t.status==='review'&&!t.done)},
    {key:'done', label:'Completed', items: visible.filter(t=>t.done)},
  ];
  let html = '';
  groups.forEach(g=>{
    if(!g.items.length) return;
    html += `<div class="group-header"><span>${g.label}</span><span class="group-line"></span><span style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text3)">${g.items.length}</span></div>`;
    g.items.forEach(t=>{
      const due = dueFmt(t.due);
      const m = getMember(t.assignee);
      const priCls = t.priority==='High'?'pri-high':t.priority==='Medium'?'pri-med':'pri-low';
      const pc = PROJ_COLORS[t.project]||'#888';
      html += `<div class="task-row${t.done?' done-row':''}${selectedId===t.id?' selected':''}" onclick="openDetail(${t.id})" style="animation-delay:${Math.random()*0.08}s">
        <span class="drag-handle">⋮⋮</span>
        <div class="check-btn${t.done?' checked':''}" onclick="event.stopPropagation();toggleDone(${t.id})"></div>
        <span class="task-name">${t.title}</span>
        <div class="task-tags">
          ${t.tags.map(tag=>`<span class="pill" style="background:rgba(108,99,255,.15);color:#a78bfa;font-size:10px">${tag}</span>`).join('')}
          <span class="pill ${priCls}">${t.priority}</span>
          <span class="proj-pill" style="color:${pc};border-color:${pc}30">${t.project}</span>
          <span class="due-lbl ${due.cls}">${due.text}</span>
          <div class="assignee-ava" style="background:${m.bg};color:${m.color}">${t.assignee.slice(0,2).toUpperCase()}</div>
        </div>
      </div>`;
    });
  });
  el.innerHTML = html;
}

function renderKanban(){
  const visible = getVisible();
  const cols = {todo:[], progress:[], review:[], done:[]};
  visible.forEach(t => {
    const key = t.done?'done':(t.status||'todo');
    if(cols[key]) cols[key].push(t);
  });
  Object.entries(cols).forEach(([key,items])=>{
    const el = document.getElementById('kb-'+key);
    const cntEl = document.getElementById('kb-'+key+'-cnt');
    if(cntEl) cntEl.textContent = items.length;
    const cards = el.querySelectorAll('.kanban-card');
    cards.forEach(c=>c.remove());
    items.forEach(t=>{
      const due = dueFmt(t.due);
      const m = getMember(t.assignee);
      const pc = PROJ_COLORS[t.project]||'#888';
      const priCls = t.priority==='High'?'pri-high':t.priority==='Medium'?'pri-med':'pri-low';
      const div = document.createElement('div');
      div.className='kanban-card';
      div.onclick=()=>openDetail(t.id);
      div.innerHTML=`
        <div class="kanban-card-title">${t.title}</div>
        <div class="kanban-card-footer">
          <span class="pill ${priCls}">${t.priority[0]}</span>
          <span style="font-size:10px;color:${pc}">${t.project}</span>
          <span style="flex:1"></span>
          <span class="due-lbl ${due.cls}" style="font-size:10px">${due.text}</span>
          <div class="assignee-ava" style="background:${m.bg};color:${m.color};width:18px;height:18px;font-size:8px">${t.assignee.slice(0,2).toUpperCase()}</div>
        </div>`;
      el.appendChild(div);
    });
  });
}

function updateCounts(){
  const open = tasks.filter(t=>!t.done);
  document.getElementById('cnt-all').textContent = open.length;
  document.getElementById('cnt-done').textContent = tasks.filter(t=>t.done).length;
  document.getElementById('cnt-today').textContent = tasks.filter(t=>t.due===daysFromNow(0)&&!t.done).length;
  const over = tasks.filter(t=>!t.done&&Math.round((new Date(t.due+'T00:00:00')-TODAY)/86400000)<0).length;
  document.getElementById('cnt-over').textContent = over;
  ['Design','Engineering','Marketing','Product'].forEach(p=>{
    document.getElementById('cnt-'+p).textContent = tasks.filter(t=>t.project===p&&!t.done).length;
  });
  const vis = getVisible();
  const done = vis.filter(t=>t.done).length;
  document.getElementById('s-total').textContent = vis.length;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-due').textContent = tasks.filter(t=>t.due===daysFromNow(0)&&!t.done).length;
  document.getElementById('s-over').textContent = over;
  const titles={all:'All tasks',today:"Today's tasks",overdue:'Overdue',done:'Completed',Design:'Design',Engineering:'Engineering',Marketing:'Marketing',Product:'Product'};
  document.getElementById('view-title').textContent = titles[projFilter]||projFilter;
  document.getElementById('view-sub').textContent = `${vis.length} task${vis.length!==1?'s':''} · ${done} completed`;
}

function render(){
  updateCounts();
  if(currentView==='list') renderList(); else renderKanban();
}

function applyFilters(){ render(); }

function toggleDone(id){
  const t=tasks.find(t=>t.id===id);
  if(t){t.done=!t.done; if(t.done)t.status='done'; else t.status='todo';}
  if(selectedId===id) openDetail(id);
  render();
}

function openDetail(id){
  selectedId=id;
  const t=tasks.find(t=>t.id===id);
  if(!t)return;
  const panel=document.getElementById('detail-panel');
  panel.classList.remove('closed');
  const m=getMember(t.assignee);
  const due=dueFmt(t.due);
  const pc=PROJ_COLORS[t.project]||'#888';
  const projTasks=tasks.filter(x=>x.project===t.project);
  const projDone=projTasks.filter(x=>x.done).length;
  const pct=projTasks.length?Math.round(projDone/projTasks.length*100):0;
  const subtasksHtml=t.subtasks.length?t.subtasks.map((s,i)=>`
    <div class="subtask-item">
      <div class="check-btn${s.d?' checked':''}" style="width:14px;height:14px;border-radius:4px;cursor:pointer" onclick="toggleSubtask(${id},${i})"></div>
      <span style="font-size:12px;color:${s.d?'var(--text3)':'var(--text2)'};${s.d?'text-decoration:line-through':''}">${s.t}</span>
    </div>`).join(''):'<div style="font-size:12px;color:var(--text3)">No subtasks</div>';
  const statusColors={todo:'var(--text3)',progress:' #60a5fa',review:'#fbbf24',done:'#4ade80'};
  const statusLabel={todo:'To Do',progress:'In Progress',review:'In Review',done:'Done'};
  document.getElementById('detail-inner').innerHTML=`
    <div class="detail-header">
      <div class="detail-title">${t.title}</div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${t.tags.map(tag=>`<span class="tag-item" style="background:rgba(108,99,255,.1);color:#a78bfa">${tag}</span>`).join('')}
      <span class="tag-item" style="background:rgba(0,0,0,0.2);color:${pc}">${t.project}</span>
    </div>
    <div class="detail-section">
      <div class="dl">Status</div>
      <div class="dv" style="color:${statusColors[t.done?'done':t.status]}">● ${statusLabel[t.done?'done':t.status]}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="detail-section">
        <div class="dl">Priority</div>
        <div class="dv">${t.priority}</div>
      </div>
      <div class="detail-section">
        <div class="dl">Due date</div>
        <div class="dv" style="color:${due.cls==='overdue'?'#f87171':due.cls==='today'?'#fbbf24':'var(--text2)'}">${due.text}</div>
      </div>
    </div>
    <div class="detail-section">
      <div class="dl">Assignee</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
        <div class="assignee-ava" style="background:${m.bg};color:${m.color};width:26px;height:26px;font-size:11px">${t.assignee.slice(0,2).toUpperCase()}</div>
        <span style="font-size:13px;color:var(--text2)">${t.assignee}</span>
      </div>
    </div>
    <div class="detail-section">
      <div class="dl">Project progress</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">${projDone}/${projTasks.length} tasks · ${pct}%</div>
    </div>
    ${t.notes?`<div class="detail-section"><div class="dl">Notes</div><div class="dv" style="line-height:1.6">${t.notes}</div></div>`:''}
    <div class="detail-section">
      <div class="dl">Subtasks (${t.subtasks.filter(s=>s.d).length}/${t.subtasks.length})</div>
      <div style="margin-top:4px">${subtasksHtml}</div>
    </div>
    <div class="detail-section">
      <div class="dl">Change status</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
        ${['todo','progress','review','done'].map(s=>`<button class="btn" style="font-size:11px;padding:4px 9px${t.status===s||(!t.done&&s==='done')?';opacity:.4':''}" onclick="changeStatus(${id},'${s}')">${statusLabel[s]}</button>`).join('')}
      </div>
    </div>
    <button class="btn" style="color:#f87171;border-color:rgba(239,68,68,.25);margin-top:4px" onclick="deleteTask(${id})">Delete task</button>
  `;
  render();
}

function toggleSubtask(taskId,idx){
  const t=tasks.find(t=>t.id===taskId);
  if(t&&t.subtasks[idx]) t.subtasks[idx].d=!t.subtasks[idx].d;
  openDetail(taskId);
}

function changeStatus(id,status){
  const t=tasks.find(t=>t.id===id);
  if(t){t.status=status;t.done=(status==='done');}
  openDetail(id);
  render();
}

function closeDetail(){
  selectedId=null;
  document.getElementById('detail-panel').classList.add('closed');
  render();
}

function deleteTask(id){
  tasks=tasks.filter(t=>t.id!==id);
  closeDetail();
}

function setProj(p,el){
  projFilter=p; tagFilter=null;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setTagFilter(tag){
  tagFilter=tag; projFilter='all';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  render();
}

function setPri(el,p){
  priFilter=p;
  document.querySelectorAll('.filter-row .chip').forEach(c=>{
    if(['all','High','Medium','Low'].includes(c.textContent.replace(/[^a-zA-Z]/g,''))) c.classList.remove('active');
  });
  el.classList.add('active');
  render();
}

function setAssignee(el,a){
  assigneeFilter=a;
  // toggle among last 4 chips
  const chips=[...document.querySelectorAll('.filter-row .chip')];
  chips.slice(-4).forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setView(v, el){
  currentView=v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('list-view').style.display = v==='list'?'':'none';
  document.getElementById('kanban-view').classList.toggle('active', v==='kanban');
  render();
}

function toggleAdd(){
  const bar=document.getElementById('add-bar');
  bar.classList.toggle('open');
  if(bar.classList.contains('open')) document.getElementById('new-title').focus();
}

function addTask(){
  const title=document.getElementById('new-title').value.trim();
  if(!title)return;
  tasks.push({
    id:nextId++,title,
    project:document.getElementById('new-proj').value,
    priority:document.getElementById('new-pri').value,
    status:document.getElementById('new-status').value,
    tags:[],assignee:'You',due:daysFromNow(3),done:false,subtasks:[],notes:''
  });
  document.getElementById('new-title').value='';
  toggleAdd();
  render();
}

document.getElementById('search-input').addEventListener('input', e => { searchQ=e.target.value; render(); });

render();
</script>
</body>
